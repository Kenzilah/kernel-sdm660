name: Build Kernel

on:
  workflow_dispatch:

env:
  DEFCONFIG: deagle_whyred_defconfig
  KBUILD_BUILD_USER: pei
  KBUILD_BUILD_HOST: Fnz_09

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio curl git python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Get Proton Clang 13
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/proton-clang"

      - name: Cek defconfig
        run: |
          ls -la arch/arm64/configs | grep -iE "deagle|whyred"
          test -f "arch/arm64/configs/$DEFCONFIG"

      - name: Integrasi SukiSU Ultra
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s
          grep -rn "config KPM" drivers/ KernelSU/ 2>/dev/null || true

      - name: Fix compiler-clang.h
        run: |
          cat -n include/linux/compiler-clang.h
          if grep -q "#ifdef CONFIG_LTO_CLANG" include/linux/compiler-clang.h; then
            echo "#endif" >> include/linux/compiler-clang.h
          fi

      - name: Siapkan defconfig (KSU + KPM + KALLSYMS)
        run: |
          PC="$HOME/proton-clang/bin"
          export PATH="$PC:$PATH"
          ARGS="O=out ARCH=arm64 CC=$PC/clang LD=$PC/ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=$PC/llvm-ar NM=$PC/llvm-nm OBJCOPY=$PC/llvm-objcopy OBJDUMP=$PC/llvm-objdump STRIP=$PC/llvm-strip HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLDFLAGS=-B/usr/bin"

          make $ARGS "$DEFCONFIG"

          ./scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KPM \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -e MODULES \
            -e MODULE_UNLOAD \
            -d MODVERSIONS

          make $ARGS olddefconfig
          grep -E "CONFIG_KSU|CONFIG_KPM|CONFIG_KALLSYMS|CONFIG_MODULES" out/.config || true

      - name: Build
        run: |
          PC="$HOME/proton-clang/bin"
          export PATH="$PC:$PATH"
          ARGS="O=out ARCH=arm64 CC=$PC/clang LD=$PC/ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- AR=$PC/llvm-ar NM=$PC/llvm-nm OBJCOPY=$PC/llvm-objcopy OBJDUMP=$PC/llvm-objdump STRIP=$PC/llvm-strip HOSTCC=/usr/bin/gcc HOSTCXX=/usr/bin/g++ HOSTLDFLAGS=-B/usr/bin"
          make -j"$(nproc)" $ARGS

      - name: Buat zip AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/ramdisk AnyKernel3/modules AnyKernel3/patch
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cat > AnyKernel3/anykernel.sh << 'EOF'
          ## AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=San-Kernel SukiSU Ultra KPM
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=whyred
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF
          (cd AnyKernel3 && zip -r9 "../San-SukiSU-whyred-AnyKernel3.zip" .)

      - name: Upload AnyKernel3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: San-SukiSU-whyred-AnyKernel3
          path: San-SukiSU-whyred-AnyKernel3.zip
